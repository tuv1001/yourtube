<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>YourTube</title>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&family=Cairo:wght@700;800&display=swap" rel="stylesheet">
<style>
* { font-family: 'Tajawal', 'Cairo', Arial, sans-serif !important; box-sizing: border-box; }
body{ background:#0f0f0f; color:#fff; margin:0; line-height:1.7; padding-bottom:90px; }
header{ background:#000; padding:14px; display:flex; justify-content:space-between; align-items:center; position:sticky; top:0; z-index:20; gap:8px; }
.logo{ font-family:'Cairo', sans-serif !important; font-size:23px; font-weight:800; color:#a855f7; white-space:nowrap; }
.logo span{ color:#fff; }
.search{ flex:1; padding:11px 14px; border-radius:20px; border:none; background:#222; color:#fff; font-size:14px; min-width:0; }
.btn{ background:#a855f7; color:#fff; border:none; padding:11px 18px; border-radius:20px; cursor:pointer; font-weight:700; font-size:14px; white-space:nowrap; }
.btn-white{ background:#fff; color:#000; }
.container{ padding:14px; max-width:700px; margin:auto; }
.tabs{ display:flex; gap:8px; margin-bottom:14px; }
.tab{ background:#222; padding:10px 16px; border-radius:20px; cursor:pointer; font-weight:700; border:none; color:#fff; font-size:14px; }
.tab.active{ background:#fff; color:#000; }
.card{ background:#1c1c1c; border-radius:14px; padding:12px; margin-bottom:14px; }
.thumb{ height:170px; background:#333; border-radius:10px; display:flex; align-items:center; justify-content:center; font-size:38px; }
.channel{ display:flex; align-items:center; gap:10px; margin:10px 0; flex-wrap:wrap; }
.avatar{ width:40px; height:40px; background:#a855f7; border-radius:50%; display:flex; align-items:center; justify-content:center; font-weight:800; flex-shrink:0; }
.sub{ background:#fff; color:#000; border:none; padding:7px 14px; border-radius:20px; cursor:pointer; font-weight:700; }
.sub.active{ background:#444; color:#fff; }
.short-card{ height:72vh; min-height:480px; background:#222; border-radius:16px; position:relative; overflow:hidden; margin-bottom:14px; display:flex; align-items:flex-end; }
.short-bg{ position:absolute; inset:0; display:flex; align-items:center; justify-content:center; font-size:70px; background:linear-gradient(180deg,#3b3b3b,#000); }
.short-info{ position:relative; padding:14px; width:100%; background:linear-gradient(transparent, rgba(0,0,0,0.92)); }
.actions{ position:absolute; left:10px; bottom:120px; display:flex; flex-direction:column; gap:10px; z-index:2; }
.action-btn{ background:#333; width:52px; height:52px; border-radius:50%; border:none; color:#fff; font-size:20px; cursor:pointer; }
.empty{ text-align:center; padding:40px 16px; color:#aaa; }
.empty h2{ color:#fff; margin:0 0 8px; }
.modal{ display:none; position:fixed; inset:0; background:rgba(0,0,0,0.8); z-index:99999; align-items:center; justify-content:center; padding:15px; padding-bottom:95px; }
.modal.open{ display:flex; }
.modal-box{ background:#1c1c1c; width:100%; max-width:600px; border-radius:20px; padding:18px; max-height:82vh; overflow-y:auto; margin-bottom:20px; }
.modal-box input, .modal-box select{ width:100%; padding:12px; border-radius:12px; border:none; background:#222; color:#fff; font-size:15px; margin-bottom:10px; text-align:right; direction:rtl; }
.modal-box label{ font-size:13px; color:#aaa; display:block; margin-bottom:4px; }
.row{ display:flex; gap:8px; padding-bottom:10px; }
.row .btn{ flex:1; }
.check{ display:flex; gap:8px; align-items:flex-start; background:#222; padding:10px; border-radius:12px; margin-bottom:10px; font-size:13px; }
.check input{ width:auto; margin-top:4px; }
</style>
</head>
<body>
<header>
<div class="logo">Your<span>Tube</span></div>
<input class="search" id="searchInput" placeholder="دور على قناة..." oninput="doSearch()">
<button class="btn" onclick="openModal()">+ نشر</button>
</header>

<div class="container">
<div class="tabs">
<button id="tab-videos" class="tab active" onclick="showTab('videos')">فيديوهات</button>
<button id="tab-shorts" class="tab" onclick="showTab('shorts')">Shorts</button>
<button id="tab-subs" class="tab" onclick="showTab('subs')">اشتراكاتي</button>
</div>

<div id="videosTab"><div id="feed"></div></div>
<div id="shortsTab" style="display:none"><div id="shortsFeed"></div></div>
<div id="subsTab" style="display:none"><div id="subsFeed"></div></div>
</div>

<div id="modal" class="modal" onclick="if(event.target===this) closeModal()">
<div class="modal-box">
<h3 style="margin:0 0 12px">نشر جديد في YourTube</h3>
<label>نوع النشر</label>
<select id="postType">
<option value="video">فيديو طويل</option>
<option value="short">Short - أقل من 60 ثانية</option>
</select>
<label>اسم قناتك</label>
<input id="channelName" placeholder="مثال: قناتي">
<label>عنوان الفيديو</label>
<input id="videoTitle" placeholder="مثال: أول فيديو لي">
<div class="check">
<input type="checkbox" id="rightsCheck">
<span>أتعهد أن هذا الفيديو من شغلي الأصلي، وما فيه أغنية مسروقة أو مقطع من يوتيوب أو من أحد ثاني. YourTube بدون حقوق.</span>
</div>
<div class="row">
<button class="btn" onclick="publish()">نشر الآن</button>
<button class="btn btn-white" onclick="closeModal()">إلغاء</button>
</div>
<p id="errorMsg" style="color:#ff6b6b;font-size:13px;display:none"></p>
</div>
</div>

<script>
let videos = JSON.parse(localStorage.getItem('yt_videos') || '[]');
let shorts = JSON.parse(localStorage.getItem('yt_shorts') || '[]');
function save(){ localStorage.setItem('yt_videos', JSON.stringify(videos)); localStorage.setItem('yt_shorts', JSON.stringify(shorts)); }
function showTab(type){
  document.getElementById('tab-videos').classList.remove('active');
  document.getElementById('tab-shorts').classList.remove('active');
  document.getElementById('tab-subs').classList.remove('active');
  document.getElementById('videosTab').style.display='none';
  document.getElementById('shortsTab').style.display='none';
  document.getElementById('subsTab').style.display='none';
  if(type==='videos'){ document.getElementById('tab-videos').classList.add('active'); document.getElementById('videosTab').style.display='block'; renderVideos(videos); }
  if(type==='shorts'){ document.getElementById('tab-shorts').classList.add('active'); document.getElementById('shortsTab').style.display='block'; renderShorts(); }
  if(type==='subs'){ document.getElementById('tab-subs').classList.add('active'); document.getElementById('subsTab').style.display='block'; renderSubs(); }
}
function renderVideos(list){
  let data = list || videos;
  let feed = document.getElementById('feed');
  if(data.length===0){ feed.innerHTML = `<div class="empty"><h2>ما فيه فيديوهات للحين</h2><p>كن أول واحد ينشر في YourTube</p><button class="btn" onclick="openModal()">+ انشر أول فيديو</button></div>`; return; }
  feed.innerHTML = data.map((v)=>`<div class="card"><div class="thumb">▶️</div><h3 style="margin:10px 0 0">${v.title}</h3><div class="channel"><div class="avatar">${v.channel.charAt(0)}</div><b>${v.channel}</b><button class="sub ${v.subs?'active':''}" onclick="toggleVideo('${v.id}')">${v.subs?'مشترك':'اشتراك'}</button><span>❤️ ${v.likes}</span></div></div>`).join('');
}
function renderShorts(){
  let feed = document.getElementById('shortsFeed');
  if(shorts.length===0){ feed.innerHTML = `<div class="empty"><h2>ما فيه Shorts للحين</h2><p>كن أول واحد ينشر شورت</p><button class="btn" onclick="openModal()">+ انشر Short</button></div>`; return; }
  feed.innerHTML = shorts.map((s)=>`<div class="short-card"><div class="short-bg">⚡</div><div class="actions"><button class="action-btn" onclick="likeShort('${s.id}')">❤️<div style="font-size:12px">${s.likes}</div></button></div><div class="short-info"><div class="channel"><div class="avatar">${s.channel.charAt(0)}</div><b>${s.channel}</b><button class="sub ${s.subs?'active':''}" onclick="toggleShort('${s.id}')">${s.subs?'مشترك':'اشتراك'}</button></div><p style="margin:0">${s.title}</p></div></div>`).join('');
}
function renderSubs(){
  let all = videos.filter(v=>v.subs).concat(shorts.filter(v=>v.subs));
  let feed = document.getElementById('subsFeed');
  if(all.length===0){ feed.innerHTML = `<div class="empty"><h2>ما اشتركت في أحد للحين</h2></div>`; return; }
  feed.innerHTML = all.map(v=>`<div class="card"><h3 style="margin:0">${v.title}</h3><b>${v.channel}</b></div>`).join('');
}
function toggleVideo(id){ let v=videos.find(x=>x.id===id); if(v){ v.subs=!v.subs; save(); renderVideos(); } }
function toggleShort(id){ let s=shorts.find(x=>x.id===id); if(s){ s.subs=!s.subs; save(); renderShorts(); } }
function likeShort(id){ let s=shorts.find(x=>x.id===id); if(s){ s.likes++; save(); renderShorts(); } }
function doSearch(){ let q=document.getElementById('searchInput').value.trim(); showTab('videos'); if(!q){ renderVideos(); return; } renderVideos(videos.filter(v=>v.channel.includes(q)||v.title.includes(q))); }
function openModal(){ document.getElementById('modal').classList.add('open'); document.getElementById('errorMsg').style.display='none'; }
function closeModal(){ document.getElementById('modal').classList.remove('open'); }
function publish(){
  let type=document.getElementById('postType').value;
  let channel=document.getElementById('channelName').value.trim();
  let title=document.getElementById('videoTitle').value.trim();
  let ok=document.getElementById('rightsCheck').checked;
  let err=document.getElementById('errorMsg');
  if(!channel || !title){ err.textContent='عبي اسم القناة والعنوان أولاً'; err.style.display='block'; return; }
  if(!ok){ err.textContent='لازم توافق أن الفيديو شغلك الأصلي وبدون حقوق'; err.style.display='block'; return; }
  let item={ id: Date.now().toString(), channel: channel, title: title, likes:0, subs:false };
  if(type==='short'){ shorts.unshift(item); save(); closeModal(); showTab('shorts'); }
  else { videos.unshift(item); save(); closeModal(); showTab('videos'); }
  document.getElementById('channelName').value='';
  document.getElementById('videoTitle').value='';
  document.getElementById('rightsCheck').checked=false;
  alert('تم النشر بنجاح');
}
renderVideos();
</script>
</body>
</html>
